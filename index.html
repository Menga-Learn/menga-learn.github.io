<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Menga Learn: percorsi di apprendimento, esercizi e domande di pratica per le certificazioni." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#f5f2eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1a18" media="(prefers-color-scheme: dark)" />
    <script>
      // Applica il tema salvato prima del primo render (vedi src/lib/theme.ts).
      try {
        var t = localStorage.getItem('menga-learn-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
          var c = t === 'dark' ? '#1b1a18' : '#f5f2eb';
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = c; });
        }
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Menga Learn" />
    <title>Menga Learn</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
